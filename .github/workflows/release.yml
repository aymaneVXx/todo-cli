name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build, test and create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (full history + tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          pip install poetry

      - name: Install dependencies
        run: |
          poetry install --no-interaction

      - name: Ruff (lint)
        run: poetry run ruff check .

      - name: Ruff (format check)
        run: poetry run ruff format --check .

      - name: Mypy (type checking)
        run: poetry run mypy todo_cli

      - name: Run unit tests
        run: poetry run pytest -q

      - name: Build artifacts
        run: poetry build

      - name: Generate changelog since last tag
        id: changelog
        shell: bash
        run: |
          CURRENT_TAG="${GITHUB_REF_NAME}"

          # Trouver le tag précédent (si il existe)
          PREV_TAG=$(git tag --sort=-creatordate | grep -v "^${CURRENT_TAG}$" | head -n 1 || true)

          echo "Current tag: $CURRENT_TAG"
          echo "Previous tag: $PREV_TAG"

          if [ -z "$PREV_TAG" ]; then
            LOG_RANGE=""
            HEADER="## Changes"
          else
            LOG_RANGE="${PREV_TAG}..${CURRENT_TAG}"
            HEADER="## Changes since ${PREV_TAG}"
          fi

          {
            echo "body<<EOF"
            echo "$HEADER"
            echo ""
            # Changelog basé sur l'historique git
            git log $LOG_RANGE --pretty=format:"- %s (%h)" || true
            echo ""
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release and upload artifacts
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.outputs.body }}
          files: |
            dist/*
